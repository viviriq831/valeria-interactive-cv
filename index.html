<style>
/* Layout: a quiet viewfinder. Full-bleed 3D stage; fine mono notes in the corners; the skills listed top-left;
   a clean panel slides in from the right while the scene glides aside. Gray carries everything, lilac is the one accent. */
:root {
  --bg: #e7e6ea;
  --bg-glow: #f7f6f8;
  --ink: #1f1d23;
  --muted: #6d6974;
  --accent: #8566bd;
  --line: rgba(38, 34, 48, 0.16);
  --panel: rgba(250, 249, 251, 0.82);
  --chip: rgba(250, 249, 251, 0.6);
  --shadow: rgba(30, 26, 40, 0.14);
  --vignette: rgba(30, 26, 40, 0.16);
  --grain: 0.09;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111014; --bg-glow: #232128; --ink: #ebe9ef; --muted: #9b97a3; --accent: #c4b0ea;
    --line: rgba(235, 232, 242, 0.14); --panel: rgba(27, 25, 31, 0.82); --chip: rgba(27, 25, 31, 0.6);
    --shadow: rgba(0, 0, 0, 0.5); --vignette: rgba(0, 0, 0, 0.5); --grain: 0.11; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111014; --bg-glow: #232128; --ink: #ebe9ef; --muted: #9b97a3; --accent: #c4b0ea;
  --line: rgba(235, 232, 242, 0.14); --panel: rgba(27, 25, 31, 0.82); --chip: rgba(27, 25, 31, 0.6);
  --shadow: rgba(0, 0, 0, 0.5); --vignette: rgba(0, 0, 0, 0.5); --grain: 0.11; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse 55% 62% at 50% 47%, var(--bg-glow), var(--bg) 80%) fixed, var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; }

#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
#stage.can-click canvas { cursor: pointer; }
#stage.dragging canvas { cursor: grabbing; }

.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 78% 72% at 50% 50%, transparent 55%, var(--vignette)); }
.grain {
  position: fixed; inset: 0; pointer-events: none; opacity: var(--grain); mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* Corner notes */
.hud { position: fixed; pointer-events: none; color: var(--muted); }
.hud-tl { top: calc(env(safe-area-inset-top, 0px) + 24px); left: max(24px, env(safe-area-inset-left, 0px)); width: min(330px, calc(100vw - 48px)); }
.hud-tr { top: calc(env(safe-area-inset-top, 0px) + 28px); right: max(24px, env(safe-area-inset-right, 0px)); text-align: right; display: grid; gap: 5px; }
.hud-bl { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); left: max(24px, env(safe-area-inset-left, 0px)); }
.hud-bc { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); left: 50%; transform: translateX(-50%); white-space: nowrap; }
.hud b { font-weight: 500; color: var(--accent); }
.hud-tl h1 {
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 42px;
  line-height: 0.95;
  color: var(--ink);
}
.hud-tl h1 em { color: var(--accent); }
.cue { margin: 0; color: var(--accent); }
.lede { margin: 0; font-size: 13px; line-height: 1.55; color: var(--muted); text-wrap: pretty; }
.rule { display: block; width: 28px; height: 1px; margin: 20px 0 14px; background: var(--accent); }

.skills { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; pointer-events: auto; }
.skills button {
  display: flex; align-items: center; gap: 10px;
  padding: 0; border: 0; background: none; cursor: pointer;
  color: var(--muted);
  font: 400 10.5px/1.3 var(--font-mono); letter-spacing: 0.09em; text-transform: uppercase;
  transition: color 0.25s;
}
.skills button::before { content: ""; width: 6px; height: 6px; border: 1px solid currentColor; flex: none; transition: background 0.25s, border-color 0.25s; }
.skills button:hover { color: var(--ink); }
.skills button.seen::before { background: currentColor; }
.skills button.current { color: var(--ink); }
.skills button.current::before { background: var(--accent); border-color: var(--accent); }

/* Prev / next */
.step {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--chip);
  color: var(--ink);
  display: grid; place-items: center;
  cursor: pointer;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: border-color 0.25s, color 0.25s;
}
.step:hover { border-color: var(--accent); color: var(--accent); }
.step svg { width: 18px; height: 18px; }
.step.prev { left: max(18px, env(safe-area-inset-left, 0px)); }
.step.next { right: max(18px, env(safe-area-inset-right, 0px)); }

/* Labels beside the symbols */
#labels { position: fixed; inset: 0; pointer-events: none; }
.tag {
  position: absolute; left: 0; top: 0;
  pointer-events: auto;
  padding: 3px 6px;
  border: 0; background: none; cursor: pointer;
  color: var(--ink);
  font: 500 10px/1.2 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase;
  white-space: nowrap;
  text-shadow: 0 0 8px var(--bg-glow), 0 0 3px var(--bg-glow);
  transition: color 0.25s;
  will-change: transform;
}
.tag:hover, .tag.current { color: var(--accent); }
.focus { position: fixed; left: 0; top: 0; pointer-events: none; transition: opacity 0.3s; will-change: transform; }
.focus i { position: absolute; width: 9px; height: 9px; border: 1px solid var(--accent); }
.focus i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
.focus i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
.focus i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
.focus i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }

.tag:focus-visible, .skills button:focus-visible, .step:focus-visible, .p-close:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

/* The panel */
.panel {
  position: fixed;
  z-index: 20;
  top: 50%;
  right: max(82px, calc(env(safe-area-inset-right, 0px) + 82px));
  transform: translateY(-50%);
  width: min(370px, calc(100vw - 40px));
  max-height: min(80vh, 640px);
  overflow-y: auto;
  background: var(--panel);
  backdrop-filter: blur(18px) saturate(1.1); -webkit-backdrop-filter: blur(18px) saturate(1.1);
  color: var(--ink);
  padding: 26px 28px 22px;
  box-shadow: 0 30px 70px var(--shadow);
  animation: slide 0.6s cubic-bezier(.2,.8,.2,1);
}
@keyframes slide { from { opacity: 0; transform: translate(24px, -50%); } }
.p-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.p-kicker { color: var(--accent); }
.p-close { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 50%; background: none; color: var(--ink); font-size: 16px; line-height: 1; cursor: pointer; transition: border-color 0.25s; }
.p-close:hover { border-color: var(--accent); }
.panel h2 { margin: 18px 0 10px; font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1; text-wrap: balance; }
.p-summary:empty { display: none; }
.p-summary { margin: 0 0 18px; color: var(--muted); line-height: 1.55; text-wrap: pretty; }
.p-entries { display: grid; }
.entry { padding: 14px 0; border-top: 1px solid var(--line); }
.entry h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.entry p { margin: 0; line-height: 1.55; font-size: 14.5px; text-wrap: pretty; }
.p-foot { display: flex; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }

.nogl { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 0 24px; text-align: center; }

@media (max-width: 720px) {
  .hud-tr, .hud-bl, .hud-bc { display: none; }
  .hud-tl h1 { font-size: 34px; margin-bottom: 8px; }
  .lede { font-size: 12px; }
  .rule { display: none; }
  .skills {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none;
  }
  .skills::-webkit-scrollbar { display: none; }
  .skills button { white-space: nowrap; padding: 8px 0; }
  .step { top: auto; transform: none; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); width: 40px; height: 40px; }
  .panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; transform: none; max-height: 66vh; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); animation-name: rise; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  .panel h2 { font-size: 32px; margin-top: 14px; }
  .hud-tl { transition: opacity 0.3s; }
  body.panel-open .hud-tl { opacity: 0; pointer-events: none; }
  body.panel-open .step { display: none; }
}
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
